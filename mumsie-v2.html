<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b8431f">
<title>Mumsie's Meals</title>
<style>
  :root{
    --bg:#fdf6ec; --card:#fff; --ink:#2a2018; --muted:#7d6c5b; --line:#efdfca;
    --accent:#c4452a; --accent2:#e8863a; --good:#2e7d4f; --warn:#fff2c9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:22px;line-height:1.35;padding-bottom:120px}
  .hero{background:linear-gradient(135deg,#b8431f 0%,#e8863a 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;
    border-radius:0 0 32px 32px;box-shadow:0 8px 24px rgba(184,67,31,.25);position:relative;overflow:hidden}
  .hero:after{content:"🍝 🍣 🍗 🍷";position:absolute;right:-6px;bottom:-14px;font-size:52px;opacity:.16;letter-spacing:8px;white-space:nowrap}
  .hero h1{margin:0;font-size:34px;letter-spacing:-.5px}
  .hero p{margin:4px 0 0;opacity:.92;font-size:20px}
  .me{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));background:rgba(255,255,255,.22);color:#fff;border:0;
    border-radius:999px;padding:8px 14px;font:inherit;font-size:17px;font-weight:600;min-height:0;width:auto;margin:0}
  main{padding:6px 16px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(80,50,20,.05)}
  .card h2{margin:0 0 6px;font-size:27px}
  .muted{color:var(--muted)}
  .sec{font-weight:800;margin:24px 4px 6px;color:var(--muted);font-size:18px;text-transform:uppercase;letter-spacing:.06em}
  button{font:inherit;font-weight:700;border:0;border-radius:18px;padding:16px 20px;min-height:64px;background:var(--accent);color:#fff;
    width:100%;margin-top:12px;cursor:pointer;transition:transform .08s}
  button:active{transform:scale(.97)}
  button.secondary{background:#fff;color:var(--ink);border:2px solid var(--line)}
  button.good{background:var(--good)}
  button.small{width:auto;min-height:46px;padding:8px 16px;font-size:18px;margin:8px 8px 0 0}
  button.danger{background:#fff;color:#a02020;border:2px solid #efc3c3}
  label{display:block;font-weight:700;margin:18px 0 8px}
  input,select,textarea{font:inherit;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
  textarea{min-height:90px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{width:auto;margin:0;min-height:52px;padding:10px 18px;border-radius:999px;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:20px}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip.item{font-weight:500;font-size:18px;min-height:46px;padding:8px 14px}
  .chip.item.on{background:var(--good);border-color:var(--good)}
  .seg{display:flex;gap:10px}
  .seg button{margin:0;background:#fff;color:var(--ink);border:2px solid var(--line);padding:14px 8px}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{margin:0;border:3px solid transparent;border-radius:22px;padding:14px 8px;min-height:130px;color:var(--ink);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;font-size:19px;line-height:1.15;box-shadow:0 2px 8px rgba(80,50,20,.08)}
  .tile .e{font-size:44px;line-height:1}
  .tile.on{border-color:var(--ink);transform:scale(1.02)}
  .tile small{font-weight:500;color:#5b4a3a;font-size:15px}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:2px solid var(--line);
    display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:4px;z-index:5}
  nav button{margin:0;min-height:60px;padding:4px;font-size:15px;background:transparent;color:var(--muted);border-radius:14px;flex:1}
  nav button span{display:block;font-size:26px;line-height:1.1}
  nav button.on{background:#fbe6d4;color:var(--accent)}
  .plate{width:150px;height:150px;border-radius:50%;margin:6px auto 10px;display:flex;align-items:center;justify-content:center;font-size:84px;
    background:radial-gradient(circle at 35% 30%,#fff 0%,#fff 55%,#f1e6d6 100%);box-shadow:0 8px 20px rgba(0,0,0,.18), inset 0 0 0 8px rgba(255,255,255,.7)}
  .result{border-radius:28px;padding:22px 16px 24px;text-align:center;color:var(--ink);border:3px solid rgba(0,0,0,.08)}
  .result h2{font-size:34px;margin:4px 0}
  .result.spin .plate{animation:wob .35s infinite alternate}
  @keyframes wob{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.06)}}
  .dish{background:var(--warn);border:2px solid #f0d98a;border-radius:16px;padding:12px 14px;margin-top:12px;font-weight:700}
  .banner{background:var(--warn);border:2px solid #f0d98a;border-radius:14px;padding:10px 14px;font-size:18px;margin:12px 0}
  .status{display:flex;gap:10px}
  .status .s{flex:1;border-radius:18px;padding:12px;border:2px solid var(--line);background:#fff;text-align:left;font-size:18px;margin:0;color:var(--ink);min-height:0}
  .status .s.done{background:#e6f4ea;border-color:#b5dbc2}
  .tag{display:inline-block;background:#f8e7d2;border-radius:999px;padding:3px 13px;font-size:17px;margin:6px 6px 0 0}
  ul.menu{margin:8px 0 0;padding-left:24px}
  ul.menu li{margin:3px 0}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2a2018;color:#fff;padding:14px 22px;border-radius:999px;
    font-weight:700;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
  #toast.show{opacity:1}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="hero">
  <button class="me" id="meBtn" onclick="changeMe()"></button>
  <h1>Mumsie's Meals</h1>
  <p>Where she's been · where to go next</p>
</div>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
/* ================= data ================= */
var KEY="mumsie_v2", MEKEY="mumsie_me";
var seed={
  restaurants:[
    {id:"r_vincents",name:"Vincent's Italian Cuisine",emoji:"🍝",hue:8,cuisine:"Italian · Metairie",
     address:"4411 Chastant St, Metairie",phone:"504-885-2984",hours:"Lunch Wed–Fri · Dinner Mon–Sat",
     url:"https://vincentsitaliancuisine.com/",
     menu:["Chicken Parmagiana","Spaghetti and Meatballs","Homemade Lasagna","Fettucine Alfredo","Chicken Marsala","Veal Parmagiana",
           "Canneloni","Eggplant Parmagiana","Corn & Crabmeat Bisque","Fried Calamari","Caesar Salad","White Chocolate Bread Pudding"]},
    {id:"r_faustos",name:"Fausto's Bistro",emoji:"🍷",hue:345,cuisine:"Italian & Sicilian · Metairie",
     address:"530 Veterans Memorial Blvd, Metairie",phone:"504-833-7121",hours:"Mon–Thu 11–9 · Fri 11–10 · Sat 5–10",
     url:"https://www.faustosbistro.com/lunch-menu/",menu:[],
     note:"Their menu is a picture on their website. Lisa can type favorites in."},
    {id:"r_nami",name:"Sushi Nami",emoji:"🍣",hue:200,cuisine:"Japanese · Metairie",
     address:"Veterans Memorial Blvd, Metairie",phone:"",hours:"Open 7 days",
     url:"https://www.sushi-nami.com/",
     menu:["Sushi rolls","Sashimi","Shrimp tempura","Chicken teriyaki","Hibachi","Fried rice","Chicken wings"],
     note:"General items only. Lisa can update from their site."},
    {id:"r_zea",name:"Zea Rotisserie & Bar",emoji:"🍗",hue:28,cuisine:"Rotisserie & Louisiana · Metairie",
     address:"4416 Veterans Memorial Blvd, Metairie",phone:"504-780-9090",hours:"Mon 4–9:30 · Tue–Sun 11–9:30",
     url:"https://zearestaurants.com/location/metairie/menu",
     menu:["Rotisserie Chicken","Rotisserie Chicken Marsala","Thai Ribs","Pepper Jelly Chicken Salad","Catfish Amandine","Shrimp Breaux Bridge",
           "Crispy Shrimp & Grits","Red Beans & Rice","Honey Island Chicken","Bacon Cheeseburger","Sedona Chicken Panini","Balsamic Salmon",
           "Spinach Dip","Key Lime Pie","Sweet Potato Pecan Bread Pudding"]}
  ],
  visits:[],
  people:["Lisa","Claudia","Tee"]
};
var state, me="";
function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  try{var s=localStorage.getItem(KEY);state=s?JSON.parse(s):clone(seed);}catch(e){state=clone(seed);}
  try{me=localStorage.getItem(MEKEY)||"";}catch(e){me="";}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function saveMe(){try{localStorage.setItem(MEKEY,me);}catch(e){}}
load();

/* ================= helpers ================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return "x"+Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function rest(id){return state.restaurants.find(function(r){return r.id===id;});}
function rname(id){var r=rest(id);return r?r.name:"(removed place)";}
function remoji(id){var r=rest(id);return r?r.emoji:"🍽️";}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}
function startOfDay(ts){var d=new Date(ts);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function dayLabel(ts){
  var diff=Math.round((startOfDay(Date.now())-startOfDay(ts))/86400000);
  if(diff===0)return "Today"; if(diff===1)return "Yesterday";
  return new Date(ts).toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});
}
function defaultMeal(){var h=new Date().getHours();return h<11?"Breakfast":(h<16?"Lunch":"Dinner");}
function sortedVisits(){return state.visits.slice().sort(function(a,b){return b.ts-a.ts;});}
function lastVisitTo(id){return sortedVisits().find(function(v){return v.restId===id;});}
function daysSince(id){var v=lastVisitTo(id);return v?(Date.now()-v.ts)/86400000:Infinity;}
function agoText(id){
  var v=lastVisitTo(id); if(!v)return "Not logged yet";
  var d=startOfDay(Date.now())-startOfDay(v.ts), n=Math.round(d/86400000);
  return n===0?"Went today":(n===1?"Went yesterday":"Went "+n+" days ago");
}
function bg(r){var h=r?r.hue:30;return "background:linear-gradient(145deg,hsl("+h+",85%,94%),hsl("+h+",75%,84%))";}
function toLocalInput(d){
  function p(n){return (n<10?"0":"")+n;}
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2200);}
function visitTags(v){
  return '<span class="tag">'+esc(v.meal)+'</span><span class="tag">'+(v.type==="Takeout"?"🥡 Takeout":"🪑 Ate there")+'</span><span class="tag">👤 '+esc(v.who)+'</span>';
}
function isLisa(){return me==="Lisa";}

/* ================= shell ================= */
var tab="home";
var tabs=[["home","🏠","Home"],["pick","🎲","Pick"],["log","➕","Log"],["history","📖","History"],["places","🍴","Places"]];
function go(t){tab=t;render();window.scrollTo(0,0);}
function render(){
  var meBtn=document.getElementById("meBtn");
  meBtn.style.display=me?"block":"none"; meBtn.textContent="👤 "+me;
  var nav=document.getElementById("nav");
  if(!me){nav.style.display="none";document.getElementById("view").innerHTML=viewWho();return;}
  nav.style.display="flex";
  nav.innerHTML=tabs.map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>';}).join("");
  var v=document.getElementById("view");
  if(tab==="home")v.innerHTML=viewHome();
  else if(tab==="pick")v.innerHTML=viewPick();
  else if(tab==="log")v.innerHTML=viewLog();
  else if(tab==="history")v.innerHTML=viewHistory();
  else v.innerHTML=viewPlaces();
}

/* ================= who am I ================= */
function viewWho(){
  return '<div class="card"><h2>Who is using this phone?</h2><div class="muted">Pick your name once. The app will remember it.</div>'+
    '<div class="chips" style="margin-top:14px">'+state.people.map(function(p,i){return '<button class="chip" onclick="setMe('+i+')">'+esc(p)+'</button>';}).join("")+'</div>'+
    '<label>Not on the list? Type your name</label><input id="newme" placeholder="Your name">'+
    '<button onclick="setMeNew()">Continue</button></div>';
}
function setMe(i){me=state.people[i];saveMe();render();}
function setMeNew(){
  var n=document.getElementById("newme").value.trim();
  if(!n){toast("Please type your name");return;}
  if(state.people.indexOf(n)===-1){state.people.push(n);save();}
  me=n;saveMe();render();
}
function changeMe(){me="";saveMe();render();}

/* ================= home ================= */
function todayVisit(meal){
  var s=startOfDay(Date.now());
  return sortedVisits().find(function(v){return v.meal===meal&&startOfDay(v.ts)===s;});
}
function viewHome(){
  var vs=sortedVisits(), h="";
  var meals=["Lunch","Dinner"]; if(todayVisit("Breakfast"))meals.unshift("Breakfast");
  h+='<div class="sec">Today</div><div class="status">'+meals.map(function(m){
    var v=todayVisit(m);
    return v?'<button class="s done" onclick="go(\'history\')"><b>✅ '+m+'</b><br>'+esc(rname(v.restId))+'<br><span class="muted">'+esc(v.who)+' · '+fmtTime(v.ts)+'</span></button>'
            :'<button class="s" onclick="quickLog(\''+m+'\')"><b>⬜ '+m+'</b><br><span class="muted">Not logged yet.<br>Tap to log</span></button>';
  }).join("")+'</div>';
  if(vs.length){
    var l=vs[0], r=rest(l.restId);
    h+='<div class="sec">Last meal</div><div class="card" style="'+bg(r)+'"><div style="display:flex;gap:14px;align-items:center"><div style="font-size:54px">'+remoji(l.restId)+'</div>'+
      '<div><h2 style="margin:0">'+esc(rname(l.restId))+'</h2><div class="muted">'+dayLabel(l.ts)+' at '+fmtTime(l.ts)+'</div></div></div>'+visitTags(l)+
      (l.ate?'<div style="margin-top:10px"><b>Had:</b> '+esc(l.ate)+'</div>':'')+'</div>';
  } else {
    h+='<div class="card"><h2>No meals logged yet</h2><div class="muted">After Mumsie eats, tap Log. It takes two taps.</div></div>';
  }
  h+='<button onclick="go(\'pick\')">🎲 Help us pick a place</button>';
  h+='<button class="secondary" onclick="go(\'log\')">➕ Log a meal</button>';
  if(vs.length>1){
    h+='<div class="sec">Recent</div>';
    vs.slice(1,5).forEach(function(x){
      h+='<div class="card" style="padding:14px"><b>'+remoji(x.restId)+' '+esc(rname(x.restId))+'</b><div class="muted">'+dayLabel(x.ts)+' · '+fmtTime(x.ts)+'</div>'+visitTags(x)+'</div>';
    });
  }
  h+='<div class="banner">Test version: data is saved only on this phone until we add the shared database.</div>';
  return h;
}
function quickLog(meal){logDraft=newDraft();logDraft.meal=meal;go("log");}

/* ================= picker ================= */
var pick={meal:defaultMeal(),avoid:3,rejected:[],current:null,dish:"",spinning:false,none:false,timer:null};
function candidates(){
  return state.restaurants.filter(function(r){return daysSince(r.id)>=pick.avoid&&pick.rejected.indexOf(r.id)===-1;});
}
function doPick(){
  var list=candidates();
  if(!list.length){pick.current=null;pick.none=true;render();return;}
  pick.none=false;pick.dish="";
  var final=list[Math.floor(Math.random()*list.length)];
  pick.spinning=true;render();
  var names=state.restaurants, i=0, started=Date.now();
  clearInterval(pick.timer);
  pick.timer=setInterval(function(){
    var el=document.getElementById("spinName"),pl=document.getElementById("spinPlate");
    var r=names[i++%names.length];
    if(el)el.textContent=r.name; if(pl)pl.textContent=r.emoji;
    if(Date.now()-started>1300){clearInterval(pick.timer);pick.spinning=false;pick.current=final;render();}
  },90);
}
function pickAnother(){if(pick.current)pick.rejected.push(pick.current.id);doPick();}
function resetPick(){pick.rejected=[];pick.current=null;pick.none=false;render();}
function setPickMeal(m){pick.meal=m;render();}
function setAvoid(n){pick.avoid=parseInt(n,10);pick.rejected=[];pick.current=null;pick.none=false;render();}
function suggestDish(){
  var r=pick.current; if(!r||!r.menu.length)return;
  var pool=r.menu.filter(function(m){return m!==pick.dish;});
  pick.dish=pool[Math.floor(Math.random()*pool.length)]||r.menu[0];render();
}
function goHere(){
  var r=pick.current; logDraft=newDraft(); logDraft.restId=r.id; logDraft.meal=pick.meal;
  if(pick.dish)logDraft.items=[pick.dish];
  go("log");
}
function viewPick(){
  var h='<div class="card"><label style="margin-top:0">Which meal?</label><div class="seg">'+
    ["Breakfast","Lunch","Dinner"].map(function(m){return '<button class="'+(pick.meal===m?"on":"")+'" onclick="setPickMeal(\''+m+'\')">'+m+'</button>';}).join("")+'</div>'+
    '<label>Skip places she went to in the last…</label><select onchange="setAvoid(this.value)">'+
    [[0,"Don't skip any"],[1,"1 day"],[3,"3 days"],[7,"7 days"]].map(function(o){return '<option value="'+o[0]+'"'+(pick.avoid===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select></div>';
  if(pick.spinning){
    h+='<div class="result spin" style="background:#fff3e3"><div class="plate" id="spinPlate">🍽️</div><h2 id="spinName">Picking…</h2></div>';
  } else if(pick.current){
    var r=pick.current, last=lastVisitTo(r.id);
    h+='<div class="result" style="'+bg(r)+'"><div class="muted">How about…</div><div class="plate">'+esc(r.emoji)+'</div><h2>'+esc(r.name)+'</h2>'+
      '<div>'+esc(r.cuisine)+'</div><div class="muted" style="margin-top:6px">'+agoText(r.id)+(last&&last.ate?' · had '+esc(last.ate):'')+'</div></div>';
    if(pick.dish)h+='<div class="dish">🍴 Try the: '+esc(pick.dish)+'</div>';
    h+='<button class="good" onclick="goHere()">✅ Yes, we\'re going here</button>';
    h+='<button class="secondary" onclick="pickAnother()">🔄 Pick another place</button>';
    if(r.menu.length)h+='<button class="secondary" onclick="suggestDish()">🍴 Suggest a dish</button>';
    h+='<div class="card"><b>Menu ideas</b>'+(r.menu.length?'<ul class="menu">'+r.menu.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ul>':'<div class="muted">No dishes added yet.</div>')+
      (r.url?'<div style="margin-top:10px"><a href="'+esc(r.url)+'" target="_blank" rel="noopener">See full menu ↗</a></div>':'')+
      (r.phone?'<div style="margin-top:6px"><a href="tel:'+esc(r.phone.replace(/[^0-9+]/g,""))+'">📞 '+esc(r.phone)+'</a></div>':'')+
      (r.hours?'<div class="muted" style="margin-top:6px">🕒 '+esc(r.hours)+'</div>':'')+'</div>';
  } else if(pick.none){
    h+='<div class="card"><h2>Out of choices</h2><div class="muted">Everything was skipped or recently visited. Start over, or lower the "skip" setting.</div></div><button onclick="resetPick()">Start over</button>';
  } else {
    h+='<button onclick="doPick()" style="min-height:90px;font-size:26px">🎲 Pick a restaurant for me</button>';
  }
  return h;
}

/* ================= log ================= */
var logDraft=null;
function newDraft(){return {restId:"",meal:defaultMeal(),type:"Ate there",who:me,items:[],text:"",custom:"",showTime:false};}
function draftTs(d){return d.custom?new Date(d.custom).getTime():Date.now();}
function viewLog(){
  if(!logDraft)logDraft=newDraft();
  var d=logDraft, r=rest(d.restId), h="";
  // duplicate warning
  var dup=sortedVisits().find(function(v){return v.meal===d.meal&&startOfDay(v.ts)===startOfDay(draftTs(d));});
  if(dup)h+='<div class="banner">⚠️ '+esc(d.meal)+' was already logged: '+esc(rname(dup.restId))+' by '+esc(dup.who)+' at '+fmtTime(dup.ts)+'.</div>';
  h+='<div class="sec" style="margin-top:12px">1 · Where did she eat?</div><div class="grid">'+state.restaurants.map(function(x){
    return '<button class="tile'+(d.restId===x.id?" on":"")+'" style="'+bg(x)+'" onclick="setRest(\''+x.id+'\')"><span class="e">'+esc(x.emoji)+'</span>'+esc(x.name)+'<small>'+agoText(x.id)+'</small></button>';
  }).join("")+'</div>';
  h+='<div class="sec">2 · Which meal?</div><div class="seg">'+["Breakfast","Lunch","Dinner"].map(function(m){return '<button class="'+(d.meal===m?"on":"")+'" onclick="logSet(\'meal\',\''+m+'\')">'+m+'</button>';}).join("")+'</div>';
  h+='<div class="sec">3 · Dine-in or takeout?</div><div class="seg">'+[["Ate there","🪑 Ate there"],["Takeout","🥡 Takeout"]].map(function(m){return '<button class="'+(d.type===m[0]?"on":"")+'" onclick="logSet(\'type\',\''+m[0]+'\')">'+m[1]+'</button>';}).join("")+'</div>';
  h+='<div class="sec">4 · Who took her?</div><div class="chips">'+state.people.map(function(p,i){return '<button class="chip'+(d.who===p?" on":"")+'" onclick="setWho('+i+')">'+esc(p)+'</button>';}).join("")+'</div>';
  if(r&&r.menu.length){
    h+='<div class="sec">What did she have? (optional)</div><div class="chips">'+r.menu.map(function(m,i){return '<button class="chip item'+(d.items.indexOf(m)>-1?" on":"")+'" onclick="toggleItem('+i+')">'+esc(m)+'</button>';}).join("")+'</div>';
  } else if(r){
    h+='<div class="sec">What did she have? (optional)</div>';
  }
  if(r)h+='<input id="f_text" placeholder="Something else? Type it here" value="'+esc(d.text)+'" oninput="logDraft.text=this.value" style="margin-top:12px">';
  h+='<div style="margin-top:14px">'+(d.showTime
      ?'<label style="margin-top:0">When was this?</label><input type="datetime-local" id="f_time" value="'+esc(d.custom||toLocalInput(new Date()))+'" onchange="logDraft.custom=this.value;render()">'
      :'<button class="small secondary" onclick="logDraft.showTime=true;render()">🕒 Not just now? Change the time</button>')+'</div>';
  h+='<button class="good" style="min-height:76px;font-size:26px;margin-top:20px" onclick="saveVisit()">✅ Save meal</button>';
  return h;
}
function setRest(id){logDraft.restId=id;logDraft.items=[];render();}
function logSet(k,v){logDraft[k]=v;render();}
function setWho(i){logDraft.who=state.people[i];render();}
function toggleItem(i){
  var m=rest(logDraft.restId).menu[i], at=logDraft.items.indexOf(m);
  if(at>-1)logDraft.items.splice(at,1); else logDraft.items.push(m);
  render();
}
function saveVisit(){
  var d=logDraft;
  if(!d.restId){toast("Tap a restaurant first");return;}
  if(!d.who){toast("Choose who took her");return;}
  var parts=d.items.slice(); if(d.text.trim())parts.push(d.text.trim());
  state.visits.push({id:uid(),restId:d.restId,meal:d.meal,type:d.type,who:d.who,ate:parts.join(", "),ts:draftTs(d)});
  save();logDraft=null;pick.rejected=[];pick.current=null;pick.dish="";
  toast("Saved! ✅");go("home");
}

/* ================= history ================= */
function viewHistory(){
  var vs=sortedVisits();
  if(!vs.length)return '<div class="card"><h2>Nothing logged yet</h2><div class="muted">Saved meals show up here.</div></div>';
  var h="",last="";
  vs.forEach(function(v){
    var dl=dayLabel(v.ts);
    if(dl!==last){h+='<div class="sec">'+dl+'</div>';last=dl;}
    h+='<div class="card" style="'+bg(rest(v.restId))+';padding:14px"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:40px">'+remoji(v.restId)+'</div>'+
      '<div><b>'+esc(rname(v.restId))+'</b><div class="muted">'+fmtTime(v.ts)+'</div></div></div>'+visitTags(v)+
      (v.ate?'<div style="margin-top:8px"><b>Had:</b> '+esc(v.ate)+'</div>':'')+
      '<button class="small danger" onclick="delVisit(\''+v.id+'\')">Delete</button></div>';
  });
  return h;
}
function delVisit(id){
  if(!confirm("Delete this entry?"))return;
  state.visits=state.visits.filter(function(v){return v.id!==id;});save();render();
}

/* ================= places ================= */
var editing=null; // null | "new" | id
function viewPlaces(){
  var h="";
  if(editing)return viewEditPlace();
  if(isLisa())h+='<button onclick="editing=\'new\';render()">➕ Add a restaurant</button>';
  else h+='<div class="banner">Only Lisa can add or change restaurants.</div>';
  h+='<div class="sec">'+state.restaurants.length+' restaurants</div>';
  state.restaurants.forEach(function(r){
    h+='<div class="card" style="'+bg(r)+'"><div style="display:flex;gap:14px;align-items:center"><div style="font-size:50px">'+esc(r.emoji)+'</div>'+
      '<div><h2 style="margin:0">'+esc(r.name)+'</h2><div class="muted">'+esc(r.cuisine)+'</div></div></div>'+
      '<div class="muted" style="margin-top:8px">'+agoText(r.id)+'</div>'+
      (r.address?'<div style="margin-top:6px">📍 '+esc(r.address)+'</div>':'')+
      (r.phone?'<div><a href="tel:'+esc(r.phone.replace(/[^0-9+]/g,""))+'">📞 '+esc(r.phone)+'</a></div>':'')+
      (r.hours?'<div class="muted">🕒 '+esc(r.hours)+'</div>':'')+
      (r.menu.length?'<ul class="menu">'+r.menu.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ul>':'')+
      (r.note?'<div class="muted" style="margin-top:8px"><i>'+esc(r.note)+'</i></div>':'')+
      (r.url?'<div style="margin-top:8px"><a href="'+esc(r.url)+'" target="_blank" rel="noopener">Full menu ↗</a></div>':'')+
      (isLisa()?'<button class="small secondary" onclick="editing=\''+r.id+'\';render()">✏️ Edit</button><button class="small danger" onclick="delPlace(\''+r.id+'\')">Remove</button>':'')+
      '</div>';
  });
  return h;
}
function viewEditPlace(){
  var r=editing==="new"?{name:"",emoji:"🍽️",hue:30,cuisine:"",address:"",phone:"",hours:"",url:"",menu:[],note:""}:rest(editing);
  return '<div class="card"><h2>'+(editing==="new"?"Add restaurant":"Edit restaurant")+'</h2>'+
    '<label>Name</label><input id="e_name" value="'+esc(r.name)+'">'+
    '<label>Emoji picture (one emoji)</label><input id="e_emoji" value="'+esc(r.emoji)+'">'+
    '<label>Type of food</label><input id="e_cuisine" value="'+esc(r.cuisine)+'">'+
    '<label>Address</label><input id="e_address" value="'+esc(r.address||"")+'">'+
    '<label>Phone</label><input id="e_phone" value="'+esc(r.phone||"")+'">'+
    '<label>Hours</label><input id="e_hours" value="'+esc(r.hours||"")+'">'+
    '<label>Website / menu link</label><input id="e_url" value="'+esc(r.url||"")+'">'+
    '<label>Her favorite dishes (one per line)</label><textarea id="e_menu" style="min-height:160px">'+esc(r.menu.join("\n"))+'</textarea>'+
    '<button class="good" onclick="savePlace()">Save</button><button class="secondary" onclick="editing=null;render()">Cancel</button></div>';
}
function savePlace(){
  function g(i){return document.getElementById(i).value.trim();}
  if(!g("e_name")){toast("Please enter a name");return;}
  var menu=document.getElementById("e_menu").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
  var data={name:g("e_name"),emoji:g("e_emoji")||"🍽️",cuisine:g("e_cuisine"),address:g("e_address"),phone:g("e_phone"),hours:g("e_hours"),url:g("e_url"),menu:menu};
  if(editing==="new"){data.id=uid();data.hue=Math.floor(Math.random()*360);state.restaurants.push(data);}
  else{var r=rest(editing);Object.keys(data).forEach(function(k){r[k]=data[k];});delete r.note;}
  save();editing=null;toast("Saved ✅");render();
}
function delPlace(id){
  if(!confirm("Remove this restaurant? Old entries will show as removed."))return;
  state.restaurants=state.restaurants.filter(function(r){return r.id!==id;});save();render();
}

render();
</script>
</body>
</html>
